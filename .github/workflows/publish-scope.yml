# ────────────────────────────────────────────────────────────────────────
# Publish-scope guard — KickTech HumanBadge public repo
# ────────────────────────────────────────────────────────────────────────
# This workflow enforces that the public repo contains ONLY the curated
# set of files that belong here. It uses a whitelist approach: anything
# not in the allowed inventory fails CI.
#
# It also invokes verify-dist.mjs, which does deeper validation of the
# dist/ artifact (manifest sanity, secrets scan, marker-strip residue
# check, syntactic validity, etc.).
#
# Together with .gitignore, this provides defense-in-depth against
# accidental publication of private artifacts (src/, scripts/, package.json,
# node_modules, secrets, OS metadata).
# ────────────────────────────────────────────────────────────────────────

name: publish-scope

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Allow manual trigger for audit/dry-run
  workflow_dispatch:

jobs:
  scope-check:
    name: File inventory whitelist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Whitelist-based inventory check
        shell: bash
        run: |
          set -euo pipefail

          # Allowed paths (POSIX extended regex, anchored implicit).
          # Top-level docs, the docs/ directory, the dist/ directory,
          # the verify-dist.mjs validator, the .github/ workflows,
          # the .gitignore. Anything else is forbidden.
          allowed='^(LICENSE|PRIVACY\.md|SECURITY\.md|README\.md|CONTRIBUTING\.md|\.gitignore|verify-dist\.mjs|\.github/.*|docs/.*|dist/.*)$'

          forbidden=$(git ls-files | grep -vE "$allowed" || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Forbidden files present in public repo:"
            printf '  - %s\n' $forbidden
            echo ""
            echo "The public repo accepts only the curated file set documented"
            echo "in the publish-scope workflow. If a new file type genuinely"
            echo "belongs here, update the allowed regex in this workflow and"
            echo "the .gitignore complement, then re-push."
            exit 1
          fi

          echo "✓ File inventory clean — all $(git ls-files | wc -l) tracked files are within the allowed scope."

      - name: Forbidden-paths check (belt + suspenders)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for path in src scripts .dev .private node_modules package.json package-lock.json yarn.lock pnpm-lock.yaml; do
            if [ -e "$path" ]; then
              echo "::error::Forbidden path present in working tree: $path"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "These paths are part of the private development repo and"
            echo "must never appear in the public mirror."
            exit 1
          fi
          echo "✓ No forbidden paths present."

      - name: Required-files check
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "LICENSE"
            "PRIVACY.md"
            "SECURITY.md"
            "README.md"
            "CONTRIBUTING.md"
            "verify-dist.mjs"
            "dist/manifest.json"
            "dist/background.js"
            "dist/content.js"
            "dist/popup.js"
            "dist/popup.html"
            "dist/tokens.js"
            "dist/utils.js"
            "dist/overlay.css"
          )
          missing=()
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              missing+=("$f")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Required files missing from public repo:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "✓ All required files present."

  verify-dist:
    name: Verify dist/ artifact
    runs-on: ubuntu-latest
    needs: scope-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run verify-dist.mjs
        run: node verify-dist.mjs

      - name: Syntactic validity of each dist/*.js
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*.js; do
            node --check "$f"
            echo "✓ $f — syntax valid"
          done
